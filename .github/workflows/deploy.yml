# .github/workflows/deploy.yml
#
# 전체 배포 파이프라인 — 인프라 · 백엔드 · 프론트엔드를 한 워크플로우에서 처리한다.
#
#   1) ecr      : ECR 저장소(+도쿄 복제 설정)만 먼저 만든다
#   2) image    : web / batch 이미지를 빌드해서 커밋 SHA 태그로 푸시
#   3) infra    : 전체 terraform apply — 이 시점엔 이미지가 이미 ECR 에 있다
#   4) frontend : ccrew-frontend/ 를 빌드해 S3 에 올리고 CloudFront 무효화
#
# 이 한 번으로 세 가지가 전부 선다. 소스가 전부 이 저장소에 있으므로
# 네 잡이 항상 같은 커밋을 빌드한다 — 저장소가 나뉘어 있을 때처럼
# "인프라는 새 버전인데 프론트는 옛 버전"으로 어긋날 여지가 없다.
#
# 왜 ECR 을 따로 먼저 만드나 (1번 잡이 존재하는 이유):
#   닭-달걀 문제다. ECR 이 없으면 docker push 를 할 수 없고, 이미지가 없는 상태로
#   전체 apply 를 하면 ECS 태스크 정의는 등록되지만 태스크가 CannotPullContainerError
#   로 계속 죽는다(ECS 는 이미지 존재를 검증하지 않으므로 apply 자체는 "성공"한다).
#   ECR 만 -target 으로 먼저 만들고 → 푸시 → 전체 apply 하면 그 창이 아예 없다.
#   최초 구축이든 매일 배포든 같은 순서로 돌아가므로 경로가 하나뿐이다.
#
# 이 워크플로우가 못 하는 것 — terraform-bootstrap/ :
#   state S3 버킷과 GitHub OIDC 롤은 여기서 만들 수 없다. Actions 가 AWS 에
#   로그인하는 수단 자체가 그 롤이고, terraform init 이 붙을 backend 가 그 버킷이다.
#   자기를 만들어 줄 권한을 자기가 만들 수는 없다.
#     최초 1회만 로컬에서:  cd terraform-bootstrap && terraform init && terraform apply
#   그 뒤로는 이 워크플로우가 전부 처리한다.

name: Deploy (Infra + Backend + Frontend)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'batch/**'
      - 'ccrew-frontend/**'
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'apply = 실제 배포 / plan = 계획만 확인(아무것도 바꾸지 않음)'
        type: choice
        options: [apply, plan]
        default: apply

permissions:
  id-token: write
  contents: read

# state 는 S3 락(use_lockfile)으로 보호되지만, 락이 잡혀 있으면 뒤에 온 실행은
# 그냥 "실패"로 끝난다. 워크플로우 단위에서 줄을 세워 그 실패를 없앤다.
# cancel-in-progress 는 false — apply 도중에 취소하면 state 와 실제 인프라가
# 어긋난 채로 남는다. 앞 배포가 끝날 때까지 기다리는 쪽이 안전하다.
concurrency:
  group: terraform-clduck
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # 로컬에서 쓰는 버전과 맞춘다. main.tf 의 backend use_lockfile 은 1.10+ 필요.
  TF_VERSION: '1.15.7'

  # 이미지 태그. 아래 terraform 명령에 -var 로 넘긴다.
  #
  # 왜 TF_VAR_ 환경변수가 아니라 -var 인가 — 이게 조용히 틀리기 쉬운 부분이다.
  # terraform 의 변수 우선순위는 낮은 쪽부터:
  #     TF_VAR_ 환경변수  <  terraform.tfvars  <  *.auto.tfvars  <  -var
  # TF_VAR_ 가 제일 약하다. terraform.tfvars 에 같은 변수가 있으면 환경변수는
  # 그냥 무시되고, "태그를 넘겼는데 옛 이미지가 배포되는" 형태로 어긋난다.
  # 반드시 이겨야 하는 값이므로 가장 강한 -var 를 쓴다.
  IMAGE_TAG: ${{ github.sha }}

  # git 에 없는 값만 여기서 주입한다.
  #
  # 인증서 ARN·알람 이메일·OAuth client_id 같은 값은 terraform/terraform.tfvars 에
  # 들어 있고 그 파일은 저장소에 추적되고 있다. 즉 CI 체크아웃에도 그대로 있으므로
  # 여기서 다시 넘길 필요가 없다(넘겨도 tfvars 가 이겨서 효과도 없다).
  #
  # 반면 client_secret 류는 secrets.auto.tfvars 에 있고 그 파일은 추적되지 않는다.
  # CI 에는 존재하지 않으므로 이 값만 GitHub Secrets 에서 가져온다.
  # (CI 에는 auto.tfvars 가 없으니 TF_VAR_ 로도 충분히 이긴다.)
  #
  # 카카오는 없어졌다 — 회원/소셜 로그인이 Cognito User Pool 로 넘어갔고, Cognito 가
  # 기본 지원하는 IdP 가 아니라 뺐다(terraform/cognito.tf). KAKAO_REST_API_KEY /
  # KAKAO_CLIENT_SECRET 은 더 이상 참조되지 않으므로 GitHub 에서 지워도 된다.
  TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0) 필수 Secrets 사전 점검
  #
  # Secrets 가 없어도 ${{ secrets.X }} 는 에러가 아니라 빈 문자열이 된다.
  # AWS_ACCOUNT_ID 가 비면 role ARN 이 arn:aws:iam:::role/... 로 조립돼
  # "왜 OIDC 가 안 되지" 를 한참 찾게 되고, GOOGLE_CLIENT_SECRET 이 비면
  # 20분 걸리는 전체 apply 를 끝까지 돌린 뒤 cognito.tf 의 변수 validation 에서 죽는다.
  # 30초짜리 잡 하나로 둘 다 앞당겨 잡는다.
  #
  # 나머지 값(인증서 ARN, google_client_id 등)은 terraform.tfvars 가 저장소에 있으므로
  # 검사하지 않는다.
  # ──────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    steps:
      # 값을 run 스크립트에 직접 보간하지 않고 env 로 넘긴다 —
      # 보간하면 값에 따옴표가 섞였을 때 스크립트가 깨지거나 임의 명령이 실행될 수 있다.
      - name: 필수 Secrets 확인
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          missing=()
          # 이름만 받아서 간접 참조로 값을 본다 — 값이 로그에 찍힐 일이 없다.
          for name in AWS_ACCOUNT_ID GOOGLE_CLIENT_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::다음 Secret 이 비어 있다 — Settings > Secrets and variables > Actions 에 등록할 것:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "필수 Secrets 확인 완료"

  # ──────────────────────────────────────────────────────────────
  # 1) ECR 저장소 생성 (+ 도쿄 복제 설정)
  #
  # 복제 설정도 같이 target 에 넣는 이유: aws_ecr_replication_configuration 은
  # "설정된 뒤에 푸시된" 이미지부터 복제한다. 푸시 후에 켜면 첫 이미지가 도쿄에
  # 안 넘어가고, failover 때 도쿄 태스크가 이미지를 못 받는다.
  # ──────────────────────────────────────────────────────────────
  ecr:
    needs: preflight
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # provider 바이너리가 수백 MB 라 매번 받으면 잡마다 1분 이상 날아간다.
      # lock 파일이 바뀔 때만 새로 받는다.
      - uses: actions/cache@v4
        with:
          path: terraform/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - run: terraform init -input=false

      - name: ECR 저장소 생성
        run: |
          # 여기서도 -var 로 태그를 넘기는 이유: 태그를 안 넘기면 compute.tf 의
          # data.aws_ecr_image 가 켜져서(count=1) ECR 최신 이미지를 조회하려 든다.
          # 지금은 저장소를 막 만드는 중이라 이미지가 하나도 없어서 그 조회가 실패한다.
          terraform apply -auto-approve -input=false \
            -var "image_tag_web=$IMAGE_TAG" \
            -var "image_tag_batch=$IMAGE_TAG" \
            -target=aws_ecr_repository.tf_web_ecr \
            -target=aws_ecr_repository.tf_batch_ecr \
            -target=aws_ecr_replication_configuration.this

  # ──────────────────────────────────────────────────────────────
  # 2) 이미지 빌드 & 푸시
  # ──────────────────────────────────────────────────────────────
  image:
    needs: ecr
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 이 잡은 terraform 을 돌리지 않고 ECR 에 푸시만 한다 —
      # 전권 롤 대신 기존의 좁은 푸시 전용 롤을 그대로 쓴다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: web 이미지 빌드 & 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/tf-web-ecr:$GITHUB_SHA" -f web/Dockerfile web/
          docker push "$ECR_REGISTRY/tf-web-ecr:$GITHUB_SHA"

      - name: batch 이미지 빌드 & 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/tf-batch-ecr:$GITHUB_SHA" -f batch/Dockerfile batch/
          docker push "$ECR_REGISTRY/tf-batch-ecr:$GITHUB_SHA"

  # ──────────────────────────────────────────────────────────────
  # 3) 전체 인프라 apply (ECS 재배포 포함)
  #
  # -target 없이 통째로 돈다. 그래서 ECS 태스크 정의가 방금 푸시한 SHA 태그로
  # 갱신되는 것과 동시에, terraform 코드와 실제 인프라가 항상 일치하게 된다.
  #
  # 주의 — 콘솔에서 손으로 바꾼 설정은 매 배포마다 코드 상태로 되돌아간다.
  # 그게 이 방식의 목적이자 대가다. 임시로 콘솔에서 만진 게 있으면 코드에 반영할 것.
  # ──────────────────────────────────────────────────────────────
  infra:
    needs: image
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@v4
        with:
          path: terraform/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - run: terraform init -input=false

      # plan 을 파일로 떠서 그대로 apply 한다. plan 과 apply 사이에 상태가 달라져
      # "계획에 없던 삭제"가 실행되는 걸 막고, 로그에 무엇이 바뀔지가 남는다.
      # -var 는 plan 에만 붙인다 — 저장된 플랜을 apply 할 때는 변수를 다시 받지 않는다
      # (플랜에 이미 확정된 값이 박혀 있고, 다시 넘기면 terraform 이 거부한다).
      - name: terraform plan
        run: |
          terraform plan -input=false -out=tfplan \
            -var "image_tag_web=$IMAGE_TAG" \
            -var "image_tag_batch=$IMAGE_TAG"

      - name: terraform apply
        run: terraform apply -input=false tfplan

      - name: 배포된 이미지 태그
        run: echo "web/batch 이미지 태그 = $GITHUB_SHA"

  # ──────────────────────────────────────────────────────────────
  # 4) 프론트엔드 배포
  #
  # 프론트 소스는 이 저장소의 ccrew-frontend/ 에 있다. web(API) · batch(워커) 와
  # 같은 저장소이므로 별도 체크아웃도, 토큰도 필요 없다 — 위 잡들이 쓰는 것과
  # 정확히 같은 커밋을 빌드한다는 보장도 덤으로 따라온다.
  #
  # 왜 infra 뒤인가: 올릴 버킷과 무효화할 CloudFront 배포가 infra 잡에서 만들어지고,
  # 그 이름/ID 를 SSM 에 써 두는 것도 거기다. 앞서 돌면 읽을 게 없다.
  # ──────────────────────────────────────────────────────────────
  frontend:
    needs: infra
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ccrew-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 캐시 키를 만들 lock 파일 위치. setup-node 는 기본으로 저장소 루트만
          # 보기 때문에, 하위 폴더에 있으면 이걸 안 주면 "lock file is not found" 로 죽는다.
          # (defaults.working-directory 는 run 스텝에만 적용되고 액션 입력에는 안 걸린다)
          cache-dependency-path: ccrew-frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # 전권 롤이 아니라 프론트 전용 롤을 쓴다 — 정적 파일 업로드에 계정 전권은 과하다.
      # 이 잡은 ccrew-repo 에서 도므로, 그 롤의 신뢰 정책에 ccrew-repo main 이
      # 들어가 있어야 한다(terraform-bootstrap/oidc.tf 의 sub_frontend_deploy).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-frontend-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: target
        name: 배포 대상 조회 (SSM)
        run: |
          bucket=$(aws ssm get-parameter --name /cloud-duck/frontend/bucket_name     --query Parameter.Value --output text)
          dist=$(aws ssm get-parameter   --name /cloud-duck/frontend/distribution_id --query Parameter.Value --output text)
          [ -n "$bucket" ] && [ -n "$dist" ] || {
            echo "::error::SSM 값이 비어 있다 — infra 잡이 제대로 끝났는지 확인할 것."
            exit 1
          }
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "dist=$dist"     >> "$GITHUB_OUTPUT"
          echo "버킷=$bucket / 배포=$dist"

      # 회원가입·로그인은 브라우저가 Cognito를 직접 호출한다(ccrew-frontend/src/lib/cognito.js).
      # 그래서 user pool id / client id / 도메인이 프론트에 들어가야 하는데, 셋 다 AWS 가
      # 생성 시점에 부여하는 값이라 소스에 적어 둘 수가 없다 — 적어 두면 재구축으로 값이
      # 바뀌는 순간 빌드는 초록불인데 로그인만 조용히 깨진다.
      # 그래서 terraform 이 SSM 에 써 두고(terraform/cognito.tf) 여기서 읽어 넣는다.
      # 버킷 이름·배포 ID 와 똑같은 방식이다.
      #
      # 빌드가 끝난 뒤 dist/config.js 를 덮어쓰는 이유: vite 환경변수는 빌드 시점에
      # 번들에 박혀서 같은 산출물을 다른 환경에 못 올린다. config.js 는 index.html 이
      # 번들보다 먼저 읽는 런타임 설정이라 나중에 갈아끼울 수 있다.
      #
      # 셋 다 브라우저 번들에 그대로 노출되는 공개값이다(앱 클라이언트에 시크릿이 없다).
      - name: 런타임 설정 생성 (dist/config.js)
        run: |
          pool=$(aws ssm get-parameter   --name /cloud-duck/frontend/cognito_user_pool_id --query Parameter.Value --output text)
          client=$(aws ssm get-parameter --name /cloud-duck/frontend/cognito_client_id    --query Parameter.Value --output text)
          domain=$(aws ssm get-parameter --name /cloud-duck/frontend/cognito_domain       --query Parameter.Value --output text)

          # 하나라도 비면 로그인 화면이 "설정이 안 됐다"만 띄우는 상태로 배포된다.
          # 그 상태를 사용자에게 내보내느니 여기서 멈추는 게 낫다.
          for pair in "cognito_user_pool_id=$pool" "cognito_client_id=$client" "cognito_domain=$domain"; do
            [ -n "${pair#*=}" ] && [ "${pair#*=}" != "None" ] || {
              echo "::error::SSM 의 ${pair%%=*} 가 비어 있다 — infra 잡이 cognito.tf 까지 apply 했는지 확인할 것."
              exit 1
            }
          done

          cat > dist/config.js <<EOF
          // 이 파일은 배포 시점에 .github/workflows/deploy.yml 이 생성한다.
          // 저장소의 public/config.js 는 로컬 개발용 기본값일 뿐이다.
          window.__CCREW_CONFIG__ = {
            apiBaseUrl: 'https://api.cloudduck.cloud',
            cognito: {
              userPoolId: '$pool',
              clientId: '$client',
              domain: '$domain',
            },
          };
          EOF

          echo "config.js 생성 완료 (pool=$pool)"

      # 캐시 수명이 정반대라 두 번에 나눈다.
      #   assets/*  : vite 가 파일명에 콘텐츠 해시를 박는다. 내용이 바뀌면 이름이
      #               바뀌므로 영구 캐시해도 낡지 않는다.
      #   나머지     : index.html, config.js 처럼 이름이 고정된 파일. 캐시되면
      #               새 번들을 가리키는 index.html 이 안 내려가 배포가 안 보인다.
      # 자산을 먼저 올려야 index.html 이 내려간 순간 그게 가리키는 파일이 이미 있다.
      - name: S3 업로드 ① 해시 붙은 자산 (영구 캐시)
        run: |
          aws s3 sync dist/ "s3://${{ steps.target.outputs.bucket }}/" --delete \
            --exclude "*" --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: S3 업로드 ② 나머지 (캐시 금지)
        run: |
          aws s3 sync dist/ "s3://${{ steps.target.outputs.bucket }}/" --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      # 완료까지 기다린다 — 안 기다리면 잡이 초록불인 시점에도 사용자는 옛 파일을 받는다.
      - name: CloudFront 무효화
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "${{ steps.target.outputs.dist }}" \
                 --paths "/*" \
                 --query Invalidation.Id --output text)
          echo "무효화 $id 생성 — 완료까지 대기"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.target.outputs.dist }}" --id "$id"
          echo "배포 완료: https://cloudduck.cloud"

  # ──────────────────────────────────────────────────────────────
  # plan 전용 — 수동 실행에서 mode=plan 을 고른 경우.
  # 아무것도 만들지 않고 무엇이 바뀔지만 보여준다.
  # ──────────────────────────────────────────────────────────────
  plan-only:
    needs: preflight
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -input=false

      # ECR 이 아직 없거나 이미지가 아직 없어도 plan 은 통과한다 —
      # terraform 은 이미지 존재 여부를 확인하지 않기 때문이다.
      - run: |
          terraform plan -input=false \
            -var "image_tag_web=$IMAGE_TAG" \
            -var "image_tag_batch=$IMAGE_TAG"
