# .github/workflows/deploy.yml
name: Build, Push & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'batch/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push web image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker build -t $ECR_REGISTRY/tf-web-ecr:$IMAGE_TAG -f web/Dockerfile web/
          docker push $ECR_REGISTRY/tf-web-ecr:$IMAGE_TAG

      - name: Build & push batch image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          docker build -t $ECR_REGISTRY/tf-batch-ecr:$IMAGE_TAG -f batch/Dockerfile batch/
          docker push $ECR_REGISTRY/tf-batch-ecr:$IMAGE_TAG

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      # ECR에 새 이미지가 올라온 뒤, ECS 태스크 정의/서비스만 갱신해서 새 이미지로 재배포한다.
      # 전체 인프라(VPC/ALB/Lambda 등) 상태까지 읽지 않도록 -target으로 ECS 리소스만 한정.
      # 도쿄(Warm Standby)도 같은 이미지 태그로 같이 갱신해야 failover 시 구버전이 뜨지 않는다.
      # 도쿄 이미지는 aws_ecr_replication_configuration이 비동기로 복제하므로, 복제가 끝나기 전에
      # 서비스가 새 태스크를 pull 시도하면 잠깐 실패할 수 있다 — ECS가 자동 재시도하므로 최종적으로는 반영됨.
      - name: Redeploy ECS services with new image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          terraform apply -auto-approve \
            -target=module.web_service.aws_ecs_task_definition.tf_task \
            -target=module.web_service.aws_ecs_service.tf_task_service \
            -target=module.batch_service.aws_ecs_task_definition.tf_task \
            -target=module.batch_service.aws_ecs_service.tf_task_service \
            -target=module.web_service_tokyo.aws_ecs_task_definition.tf_task \
            -target=module.web_service_tokyo.aws_ecs_service.tf_task_service \
            -target=module.admin_service.aws_ecs_task_definition.tf_task \
            -target=module.admin_service.aws_ecs_service.tf_task_service \
            -var "image_tag_web=$IMAGE_TAG" \
            -var "image_tag_batch=$IMAGE_TAG" \
            -var "certificate_arn=${{ secrets.CERTIFICATE_ARN }}" \
            -var "certificate_arn_tokyo=${{ secrets.CERTIFICATE_ARN_TOKYO }}" \
            -var "github_org=${{ github.repository_owner }}" \
            -var "github_repo=${{ github.event.repository.name }}"
