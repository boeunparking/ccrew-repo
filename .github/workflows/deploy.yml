# .github/workflows/deploy.yml
#
# 전체 배포 파이프라인 — 인프라 · ECR · 이미지 · ECS 를 한 워크플로우에서 처리한다.
#
#   1) ecr     : ECR 저장소(+도쿄 복제 설정)만 먼저 만든다
#   2) image   : web / batch 이미지를 빌드해서 커밋 SHA 태그로 푸시
#   3) infra   : 전체 terraform apply — 이 시점엔 이미지가 이미 ECR 에 있다
#
# 왜 ECR 을 따로 먼저 만드나 (1번 잡이 존재하는 이유):
#   닭-달걀 문제다. ECR 이 없으면 docker push 를 할 수 없고, 이미지가 없는 상태로
#   전체 apply 를 하면 ECS 태스크 정의는 등록되지만 태스크가 CannotPullContainerError
#   로 계속 죽는다(ECS 는 이미지 존재를 검증하지 않으므로 apply 자체는 "성공"한다).
#   ECR 만 -target 으로 먼저 만들고 → 푸시 → 전체 apply 하면 그 창이 아예 없다.
#   최초 구축이든 매일 배포든 같은 순서로 돌아가므로 경로가 하나뿐이다.
#
# 이 워크플로우가 못 하는 것 — terraform-bootstrap/ :
#   state S3 버킷과 GitHub OIDC 롤은 여기서 만들 수 없다. Actions 가 AWS 에
#   로그인하는 수단 자체가 그 롤이고, terraform init 이 붙을 backend 가 그 버킷이다.
#   자기를 만들어 줄 권한을 자기가 만들 수는 없다.
#     최초 1회만 로컬에서:  cd terraform-bootstrap && terraform init && terraform apply
#   그 뒤로는 이 워크플로우가 전부 처리한다.

name: Deploy (Infra + ECR + Image + ECS)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'batch/**'
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'apply = 실제 배포 / plan = 계획만 확인(아무것도 바꾸지 않음)'
        type: choice
        options: [apply, plan]
        default: apply

permissions:
  id-token: write
  contents: read

# state 는 S3 락(use_lockfile)으로 보호되지만, 락이 잡혀 있으면 뒤에 온 실행은
# 그냥 "실패"로 끝난다. 워크플로우 단위에서 줄을 세워 그 실패를 없앤다.
# cancel-in-progress 는 false — apply 도중에 취소하면 state 와 실제 인프라가
# 어긋난 채로 남는다. 앞 배포가 끝날 때까지 기다리는 쪽이 안전하다.
concurrency:
  group: terraform-clduck
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # 로컬에서 쓰는 버전과 맞춘다. main.tf 의 backend use_lockfile 은 1.10+ 필요.
  TF_VERSION: '1.15.7'

  # terraform 변수 주입.
  #
  # terraform/terraform.tfvars 는 .gitignore 의 *.tfvars 로 제외돼 있어 git 에 없다.
  # 즉 CI 체크아웃에는 그 파일이 존재하지 않으므로, default 가 없는 변수는 전부
  # 여기서 넣어 줘야 한다. 안 넣으면 "No value for required variable" 로 apply 가 멈춘다.
  #
  # 비밀 아닌 값(인증서 ARN, 이메일, OAuth client_id)은 Repository *Variables*,
  # 진짜 비밀(client_secret)만 *Secrets* 에 둔다. Variables 는 로그에서 값이 보이고
  # 나중에 되읽을 수 있어서, 뭐가 들어가 있는지 확인할 수 있다는 게 실무상 큰 차이다.
  #
  # 등록 위치: Settings > Secrets and variables > Actions
  #   [Variables] CERTIFICATE_ARN, CERTIFICATE_ARN_TOKYO, VPN_SERVER_CERT_ARN,
  #               VPN_CLIENT_ROOT_CERT_ARN, ALARM_EMAIL,
  #               GOOGLE_CLIENT_ID, KAKAO_REST_API_KEY
  #   [Secrets]   AWS_ACCOUNT_ID(이미 등록돼 있음), GOOGLE_CLIENT_SECRET,
  #               (선택) KAKAO_CLIENT_SECRET
  TF_VAR_image_tag_web: ${{ github.sha }}
  TF_VAR_image_tag_batch: ${{ github.sha }}
  TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
  TF_VAR_certificate_arn_tokyo: ${{ vars.CERTIFICATE_ARN_TOKYO }}
  TF_VAR_vpn_server_cert_arn: ${{ vars.VPN_SERVER_CERT_ARN }}
  TF_VAR_vpn_client_root_cert_arn: ${{ vars.VPN_CLIENT_ROOT_CERT_ARN }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
  TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  TF_VAR_kakao_rest_api_key: ${{ vars.KAKAO_REST_API_KEY }}
  # 카카오 콘솔에서 client_secret 을 '사용함'으로 켠 경우에만 채운다. 안 켰으면 빈 값이 정상.
  TF_VAR_kakao_client_secret: ${{ secrets.KAKAO_CLIENT_SECRET }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0) 필수 값 사전 점검
  #
  # terraform 이 잡아주는 건 "값이 아예 없는" 경우뿐이다. Variables 를 등록 안 하면
  # ${{ vars.X }} 는 에러가 아니라 빈 문자열로 치환되고, default 가 "" 인 변수
  # (google_client_id, kakao_rest_api_key)는 빈 값으로 조용히 apply 돼 버린다.
  # 그러면 apply 는 초록불인데 소셜 로그인 버튼만 사라지는, 가장 찾기 어려운 형태로 깨진다.
  # 그 경로를 여기서 막는다 — 30초짜리 잡 하나로 20분짜리 배포 실패를 앞당겨 잡는다.
  # ──────────────────────────────────────────────────────────────
  preflight:
    runs-on: ubuntu-latest
    steps:
      # 값을 run 스크립트에 직접 보간하지 않고 env 로 넘긴다 —
      # 보간하면 값에 따옴표가 섞였을 때 스크립트가 깨지거나 임의 명령이 실행될 수 있다.
      - name: 필수 Variables / Secrets 확인
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN }}
          CERTIFICATE_ARN_TOKYO: ${{ vars.CERTIFICATE_ARN_TOKYO }}
          VPN_SERVER_CERT_ARN: ${{ vars.VPN_SERVER_CERT_ARN }}
          VPN_CLIENT_ROOT_CERT_ARN: ${{ vars.VPN_CLIENT_ROOT_CERT_ARN }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          KAKAO_REST_API_KEY: ${{ vars.KAKAO_REST_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          missing=()
          # 이름만 받아서 간접 참조로 값을 본다 — 값이 로그에 찍힐 일이 없다.
          for name in AWS_ACCOUNT_ID CERTIFICATE_ARN CERTIFICATE_ARN_TOKYO \
                      VPN_SERVER_CERT_ARN VPN_CLIENT_ROOT_CERT_ARN ALARM_EMAIL \
                      GOOGLE_CLIENT_ID KAKAO_REST_API_KEY GOOGLE_CLIENT_SECRET; do
            [ -n "${!name}" ] || missing+=("$name")
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::다음 값이 비어 있다 — Settings > Secrets and variables > Actions 에 등록할 것:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "필수 값 확인 완료"

  # ──────────────────────────────────────────────────────────────
  # 1) ECR 저장소 생성 (+ 도쿄 복제 설정)
  #
  # 복제 설정도 같이 target 에 넣는 이유: aws_ecr_replication_configuration 은
  # "설정된 뒤에 푸시된" 이미지부터 복제한다. 푸시 후에 켜면 첫 이미지가 도쿄에
  # 안 넘어가고, failover 때 도쿄 태스크가 이미지를 못 받는다.
  # ──────────────────────────────────────────────────────────────
  ecr:
    needs: preflight
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # provider 바이너리가 수백 MB 라 매번 받으면 잡마다 1분 이상 날아간다.
      # lock 파일이 바뀔 때만 새로 받는다.
      - uses: actions/cache@v4
        with:
          path: terraform/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - run: terraform init -input=false

      - name: ECR 저장소 생성
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.tf_web_ecr \
            -target=aws_ecr_repository.tf_batch_ecr \
            -target=aws_ecr_replication_configuration.this

  # ──────────────────────────────────────────────────────────────
  # 2) 이미지 빌드 & 푸시
  # ──────────────────────────────────────────────────────────────
  image:
    needs: ecr
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 이 잡은 terraform 을 돌리지 않고 ECR 에 푸시만 한다 —
      # 전권 롤 대신 기존의 좁은 푸시 전용 롤을 그대로 쓴다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: web 이미지 빌드 & 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/tf-web-ecr:$GITHUB_SHA" -f web/Dockerfile web/
          docker push "$ECR_REGISTRY/tf-web-ecr:$GITHUB_SHA"

      - name: batch 이미지 빌드 & 푸시
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/tf-batch-ecr:$GITHUB_SHA" -f batch/Dockerfile batch/
          docker push "$ECR_REGISTRY/tf-batch-ecr:$GITHUB_SHA"

  # ──────────────────────────────────────────────────────────────
  # 3) 전체 인프라 apply (ECS 재배포 포함)
  #
  # -target 없이 통째로 돈다. 그래서 ECS 태스크 정의가 방금 푸시한 SHA 태그로
  # 갱신되는 것과 동시에, terraform 코드와 실제 인프라가 항상 일치하게 된다.
  #
  # 주의 — 콘솔에서 손으로 바꾼 설정은 매 배포마다 코드 상태로 되돌아간다.
  # 그게 이 방식의 목적이자 대가다. 임시로 콘솔에서 만진 게 있으면 코드에 반영할 것.
  # ──────────────────────────────────────────────────────────────
  infra:
    needs: image
    if: inputs.mode != 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@v4
        with:
          path: terraform/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - run: terraform init -input=false

      # plan 을 파일로 떠서 그대로 apply 한다. plan 과 apply 사이에 상태가 달라져
      # "계획에 없던 삭제"가 실행되는 걸 막고, 로그에 무엇이 바뀔지가 남는다.
      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false tfplan

      - name: 배포된 이미지 태그
        run: echo "web/batch 이미지 태그 = $GITHUB_SHA"

  # ──────────────────────────────────────────────────────────────
  # plan 전용 — 수동 실행에서 mode=plan 을 고른 경우.
  # 아무것도 만들지 않고 무엇이 바뀔지만 보여준다.
  # ──────────────────────────────────────────────────────────────
  plan-only:
    needs: preflight
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -input=false

      # ECR 이 아직 없거나 이미지가 아직 없어도 plan 은 통과한다 —
      # terraform 은 이미지 존재 여부를 확인하지 않기 때문이다.
      - run: terraform plan -input=false
